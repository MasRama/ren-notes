name: Windows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Windows (clippy, tests, installer, smoke)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Build the installer
        working-directory: app
        run: npm run tauri build -- --bundles nsis
      # Install it as a user would, write a note with a picture and a link,
      # and screenshot each step; see tools/windows/smoke.ps1.
      - name: Install and use Renotes
        shell: pwsh
        run: ./tools/windows/smoke.ps1
      - name: Upload the shots and the installer
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-smoke
          path: |
            shots/
            target/release/bundle/nsis/*-setup.exe
          if-no-files-found: warn
