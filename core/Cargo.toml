[package]
name = "renotes-core"
description = "Storage and logic for Renotes: folders, notes, search, attachments"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = "1"

[dev-dependencies]
tempfile = "3"
