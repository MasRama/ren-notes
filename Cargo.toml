[workspace]
members = ["core", "app/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.2.0" # x-release-please-version
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/MasRama/ren-notes"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Making the notes key takes seconds unoptimised; keep dev builds quick.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
