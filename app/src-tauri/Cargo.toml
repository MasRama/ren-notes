[package]
name = "renotes-app"
description = "Renotes: the window, its commands and the renotes:// protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "renotes"
path = "src/main.rs"

[dependencies]
renotes-core = { path = "../../core" }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# The HTTP stack WebKitGTK already brings, for link previews.
soup3 = "0.5"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
